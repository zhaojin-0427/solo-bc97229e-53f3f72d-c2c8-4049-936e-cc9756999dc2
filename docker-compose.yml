services:
  lineage-web:
    build:
      context: ./app
    image: sql-lineage-web:latest
    container_name: sql-lineage-web
    ports:
      - "8000:8000"
    environment:
      # SQLite 数据库文件位置（挂载到命名卷，容器重建后数据保留）
      LINEAGE_DATA_DIR: /data
    volumes:
      - lineage-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  lineage-data:
